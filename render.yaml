# Render Blueprint — GitPulse backend
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gitpulse-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: gitpulse-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: gitpulse-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: gitpulse-redis
          type: redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"
      - key: GITHUB_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: INGESTION_COMMIT_CAP
        value: "2000"

  - type: worker
    name: gitpulse-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker -l info --concurrency=1
    envVars:
      - key: SECRET_KEY
        fromService:
          name: gitpulse-api
          type: web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: gitpulse-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: gitpulse-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: gitpulse-redis
          type: redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"
      - key: GITHUB_TOKEN
        sync: false
      - key: INGESTION_COMMIT_CAP
        value: "2000"

  - type: redis
    name: gitpulse-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: gitpulse-db
    plan: free
